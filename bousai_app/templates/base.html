<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --font-scale: 1;
      --primary-blue: #d8d8d8;
      --text-blue: #222;
      --button-blue: #dceaf8;
      --line-color: #999;
      --page-background: #fff;
      --page-text: #222;
      --header-background: #d8d8d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--page-text);
      background: var(--page-background);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: calc(16px * var(--font-scale));
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 8px 14px;
      color: #222;
      background: var(--header-background);
      border: 2px solid #333;
    }

    :root[data-background="black"] body,
    :root[data-background="black"] .app-header,
    :root[data-background="black"] .app-title,
    :root[data-background="black"] .app-title a,
    :root[data-background="black"] .header-tools,
    :root[data-background="black"] .main-nav a {
      color: #fff;
    }

    :root[data-background="black"] .menu-toggle {
      color: #fff;
      background: #333;
    }

    .app-title {
      margin: 0;
      color: #222;
      font-size: calc(29px * var(--font-scale));
      font-weight: 400;
    }

    .app-title a { color: inherit; text-decoration: none; }

    .menu-toggle {
      display: none;
      min-width: 44px;
      min-height: 44px;
      margin-left: 10px;
      color: #222;
      background: var(--button-blue);
      border: 1px solid #8998a6;
      font-size: 24px;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: calc(16px * var(--font-scale));
    }

    .background-tools { display: inline-flex; align-items: center; gap: 4px; }
    .background-button {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid #56616b;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-size: 0.75rem;
    }
    .background-button[data-background="black"] { color: #fff; background: #111; }
    .background-button[data-background="white"] { color: #222; background: #fff; }
    .background-button[data-background="blue"] { color: #fff; background: #1769aa; }
    .background-button[data-background="yellow"] { color: #222; background: #ffe66d; }

    .main-nav {
      display: flex;
      gap: 25px;
      align-items: center;
      width: min(100% - 40px, 1280px);
      margin: 12px auto 0;
    }

    .main-nav a,
    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 37px;
      padding: 6px 26px;
      color: #1e2d3c;
      background: var(--button-blue);
      border: 1px solid #8493a1;
      text-decoration: none;
      white-space: nowrap;
    }

    .tool-button {
      min-height: 54px;
      padding: 6px 20px;
      color: #222;
      background: var(--button-blue);
      border-color: #8998a6;
      font-size: calc(20px * var(--font-scale));
      cursor: pointer;
    }

    .main-nav a:hover,
    .tool-button:hover { background: #c9def2; }

    main {
      width: min(100% - 40px, 1280px);
      margin: 20px auto 24px;
      animation: pageEnter 0.35s ease both;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid var(--line-color);
      background: #fff;
    }

    .map-card { padding: 0; overflow: hidden; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 16px 20px;
      color: var(--text-blue);
      font-size: calc(1.5rem * var(--font-scale));
    }

    .section-icon { display: inline-flex; align-items: center; justify-content: center; }

    .map-box {
      width: 100%;
      height: 430px;
      overflow: hidden;
      background: #dfeef7;
    }

    #shelterMap { width: 100%; height: 100%; min-height: 430px; }

    .weather-card { background: #fff; }
    .weather-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .weather-title { display: flex; align-items: center; gap: 10px; font-size: calc(1.35rem * var(--font-scale)); }
    .weather-content { padding-top: 12px; }
    .weather-item { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #18a770; }
    .weather-meta { color: #596979; line-height: 1.7; }

    @media (max-width: 600px) {
      .app-header { display: block; padding: 12px 16px; }
      .app-title { font-size: calc(22px * var(--font-scale)); }
      .menu-toggle { display: inline-block; vertical-align: middle; }
      .header-tools { display: block; margin-top: 10px; }
      .main-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .header-tools { font-size: calc(14px * var(--font-scale)); }
      main { width: min(100% - 20px, 1280px); margin-top: 10px; }
      .main-nav.is-collapsed { display: none; }
      .map-box { height: 340px; }
      #shelterMap { min-height: 340px; }
      .weather-header { display: block; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-title"><a href="/">防災アプリ</a></h1>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="メニューを開閉" aria-expanded="true">&#9776;</button>
    </div>
    <div class="header-tools">
      <span>文字サイズ変更</span>
      <button id="font-size-standard" class="tool-button" type="button" aria-pressed="true">標準</button>
      <button id="font-size-large" class="tool-button" type="button" aria-pressed="false">拡大</button>
      <span>背景色</span>
      <div class="background-tools" aria-label="背景色変更">
        <button class="background-button" type="button" data-background="black" aria-label="背景を黒にする">黒</button>
        <button class="background-button" type="button" data-background="white" aria-label="背景を白にする">白</button>
        <button class="background-button" type="button" data-background="blue" aria-label="背景を青にする">青</button>
        <button class="background-button" type="button" data-background="yellow" aria-label="背景を黄色にする">黄</button>
      </div>
      {% if session.logged_in %}
        <a class="tool-button" href="/logout">ログアウト</a>
        <span>ログイン中</span>
      {% else %}
        <a class="tool-button" href="{{ url_for('login', next=request.full_path) }}">ログイン</a>
        <span>未ログイン</span>
      {% endif %}
    </div>
  </header>

  <nav id="main-nav" class="main-nav">
    {% if request.endpoint != 'index' %}<a href="/">ホームへ</a>{% endif %}
    <a href="/shelter_search">避難所検索へ</a>
    {% if session.logged_in %}
      <a href="/shelter_add">新規避難所追加</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
    {% endif %}
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <script>
    (function() {
      const standardButton = document.getElementById('font-size-standard');
      const largeButton = document.getElementById('font-size-large');
      const savedSize = localStorage.getItem('fontSize') === 'large' ? 'large' : 'standard';

      function applyFontSize(size) {
        const isLarge = size === 'large';
        document.documentElement.style.setProperty('--font-scale', isLarge ? '1.2' : '1');
        standardButton.setAttribute('aria-pressed', String(!isLarge));
        largeButton.setAttribute('aria-pressed', String(isLarge));
        localStorage.setItem('fontSize', size);
      }

      standardButton.addEventListener('click', function() { applyFontSize('standard'); });
      largeButton.addEventListener('click', function() { applyFontSize('large'); });
      applyFontSize(savedSize);
    })();

    (function() {
      const backgrounds = {
        black: { page: '#111', text: '#f5f5f5', header: '#222' },
        white: { page: '#fff', text: '#222', header: '#d8d8d8' },
        blue: { page: '#dceeff', text: '#14324a', header: '#8fc3e8' },
        yellow: { page: '#fff8cf', text: '#3b3211', header: '#f0d66a' }
      };
      const savedBackground = localStorage.getItem('backgroundColor') || 'white';
      function applyBackground(name) {
        const colors = backgrounds[name] || backgrounds.white;
        const root = document.documentElement;
        root.dataset.background = name;
        root.style.setProperty('--page-background', colors.page);
        root.style.setProperty('--page-text', colors.text);
        root.style.setProperty('--header-background', colors.header);
        localStorage.setItem('backgroundColor', name);
      }
      document.querySelectorAll('.background-button').forEach(function(button) {
        button.addEventListener('click', function() { applyBackground(this.dataset.background); });
      });
      applyBackground(savedBackground);
    })();

    (function() {
      const toggle = document.getElementById('menu-toggle');
      const nav = document.getElementById('main-nav');
      if (!toggle || !nav) return;
      toggle.addEventListener('click', function() {
        const collapsed = nav.classList.toggle('is-collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
      });
    })();
  </script>
</body>
</html>
