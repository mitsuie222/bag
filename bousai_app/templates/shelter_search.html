{% extends "base.html" %}

{% block content %}
<style>
  .search-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 0 40px;
  }

  .search-panel {
    background: rgba(255,255,255,0.82);
    border-radius: 18px;
    box-shadow: 0 12px 28px rgba(16, 44, 76, 0.12);
    border: 1px solid rgba(13, 62, 114, 0.08);
    padding: 18px 18px 14px;
  }

  .search-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .search-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(1.5rem, 2vw, 2rem);
    font-weight: 800;
    color: var(--blue-900);
  }

  .search-title .section-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(29, 130, 210, 0.12);
    color: var(--blue-700);
    font-size: 1.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .filter-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(232, 243, 255, 0.9);
    border: 1px solid rgba(29, 130, 210, 0.15);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--blue-900);
    font-weight: 700;
  }

  .filter-box select {
    border: 1px solid rgba(13, 62, 114, 0.15);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 1rem;
    background: white;
    color: var(--text);
  }

  .map-shell {
    margin-top: 14px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(13,62,114,0.08);
    background: #dfeef7;
  }

  #shelterMap {
    width: 100%;
    height: 620px;
    min-height: 420px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.93rem;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff3b30;
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(255,59,48,0.16);
  }

  @media (max-width: 640px) {
    .search-header {
      align-items: flex-start;
      flex-direction: column;
    }

    #shelterMap {
      height: 480px;
    }
  }
</style>

<div class="search-wrap">
  <div class="search-panel">
    <div class="search-header">
      <div class="search-title">
        <span class="section-icon" aria-hidden="true">🧭</span>
        <span>青森市避難所検索</span>
      </div>

      <label class="filter-box" for="districtSelect">
        <span>地域選択</span>
        <select id="districtSelect" aria-label="地域を選択">
          <option value="全域">全域</option>
          <option value="北部">北部</option>
          <option value="西部">西部</option>
          <option value="中央部">中央部</option>
          <option value="東部">東部</option>
          <option value="南東部">南東部</option>
          <option value="南部">南部</option>
          <option value="浪岡地区">浪岡地区</option>
        </select>
      </label>
    </div>

    <div class="map-shell">
      <div id="shelterMap"></div>
    </div>
    <div class="legend"><span class="legend-dot"></span>避難所（赤丸）</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const map = L.map('shelterMap', {
    zoomControl: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    attributionControl: true
  }).setView([40.822, 140.74], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);
  const boundaryLayer = L.layerGroup().addTo(map);
  const districtSelect = document.getElementById('districtSelect');

  const districtBoundaries = {
    '北部': [[40.857, 140.705], [40.865, 140.725], [40.865, 140.765], [40.845, 140.782], [40.835, 140.772], [40.832, 140.738], [40.842, 140.71], [40.857, 140.705]],
    '西部': [[40.83, 140.665], [40.838, 140.675], [40.842, 140.71], [40.832, 140.738], [40.815, 140.735], [40.806, 140.695], [40.818, 140.67], [40.83, 140.665]],
    '中央部': [[40.805, 140.72], [40.818, 140.718], [40.82, 140.765], [40.805, 140.765], [40.8, 140.738], [40.805, 140.72]],
    '東部': [[40.805, 140.72], [40.82, 140.718], [40.82, 140.766], [40.805, 140.77], [40.796, 140.75], [40.798, 140.728], [40.805, 140.72]],
    '南東部': [[40.788, 140.748], [40.81, 140.772], [40.81, 140.805], [40.79, 140.81], [40.775, 140.788], [40.778, 140.758], [40.788, 140.748]],
    '南部': [[40.78, 140.698], [40.792, 140.706], [40.8, 140.738], [40.794, 140.764], [40.774, 140.768], [40.764, 140.728], [40.77, 140.703], [40.78, 140.698]],
    '浪岡地区': [[40.86, 140.685], [40.878, 140.69], [40.882, 140.728], [40.87, 140.744], [40.852, 140.732], [40.854, 140.695], [40.86, 140.685]]
  };

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));
  }

  function popupHtml(shelter) {
    return `
      <div style="min-width: 200px; max-width: 240px; line-height: 1.7;">
        <div style="font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; color: #0d3e72;">${escapeHtml(shelter.name)}</div>
        <div><strong>地区:</strong> ${escapeHtml(shelter.district || '未登録')}</div>
        <div><strong>住所:</strong> ${escapeHtml(shelter.address || '未登録')}</div>
        <div><strong>収容人数:</strong> ${escapeHtml(shelter.capacity ?? '未登録')}人</div>
        <div><strong>津波:</strong> ${escapeHtml(shelter.tsunami || '未登録')}</div>
        <div><strong>土砂災害:</strong> ${escapeHtml(shelter.landslide || '未登録')}</div>
        <div style="margin-top: 8px; color: #42566d;">${escapeHtml(shelter.description || '')}</div>
      </div>
    `;
  }

  function renderMarkers(selectedDistrict) {
    markersLayer.clearLayers();
    boundaryLayer.clearLayers();

    const shelters = selectedDistrict === '全域'
      ? allShelters
      : allShelters.filter(s => s.district === selectedDistrict);

    shelters.forEach(function (shelter) {
      if (!shelter.lat || !shelter.lng) return;

      const marker = L.circleMarker([shelter.lat, shelter.lng], {
        radius: 8,
        color: '#d11a2a',
        weight: 2,
        fillColor: '#ff3b30',
        fillOpacity: 0.9
      });

      marker.bindPopup(popupHtml(shelter));
      marker.addTo(markersLayer);
    });

    if (selectedDistrict !== '全域' && districtBoundaries[selectedDistrict]) {
      const polygon = L.polygon(districtBoundaries[selectedDistrict], {
        color: '#ff3b30',
        weight: 3,
        opacity: 1,
        fillOpacity: 0.08,
        dashArray: '8 6'
      });
      polygon.addTo(boundaryLayer);
      map.fitBounds(polygon.getBounds().pad(0.18));
      return;
    }

    if (shelters.length > 0) {
      const bounds = L.latLngBounds(shelters.map(s => [s.lat, s.lng]));
      map.fitBounds(bounds.pad(0.22));
    } else {
      map.setView([40.822, 140.74], 12);
    }
  }

  fetch('/shelters')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('避難所データの取得に失敗しました');
      }
      return response.json();
    })
    .then(function (data) {
      window.allShelters = data;
      renderMarkers('全域');
    })
    .catch(function (error) {
      console.error(error);
      const message = '避難所データを取得できませんでした。';
      map.setView([40.822, 140.74], 12);
      L.popup()
        .setLatLng([40.822, 140.74])
        .setContent(message)
        .openOn(map);
    });

  districtSelect.addEventListener('change', function () {
    renderMarkers(this.value);
  });
});
</script>
{% endblock %}
