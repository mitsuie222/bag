{% extends "base.html" %}

{% block content %}
<style>
  .search-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 0 40px;
  }

  .search-panel {
    background: rgba(255,255,255,0.82);
    border-radius: 18px;
    box-shadow: 0 12px 28px rgba(16, 44, 76, 0.12);
    border: 1px solid rgba(13, 62, 114, 0.08);
    padding: 18px 18px 14px;
  }

  .search-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .search-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(1.5rem, 2vw, 2rem);
    font-weight: 800;
    color: var(--blue-900);
  }

  .search-title .section-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(29, 130, 210, 0.12);
    color: var(--blue-700);
    font-size: 1.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .filter-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(232, 243, 255, 0.9);
    border: 1px solid rgba(29, 130, 210, 0.15);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--blue-900);
    font-weight: 700;
  }

  .filter-box select {
    border: 1px solid rgba(13, 62, 114, 0.15);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 1rem;
    background: white;
    color: var(--text);
  }

  .filter-box {
    flex-wrap: wrap;
  }

  .shelter-visibility-button {
    border: 1px solid var(--blue-700);
    border-radius: 8px;
    padding: 8px 12px;
    color: white;
    background: var(--blue-700);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .map-shell {
    margin-top: 14px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(13,62,114,0.08);
    background: #dfeef7;
  }

  .search-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
    gap: 16px;
    margin-top: 14px;
  }

  .search-layout .map-shell { margin-top: 0; }

  .shelter-detail-panel {
    min-height: 620px;
    padding: 18px;
    border: 1px solid rgba(13,62,114,0.12);
    border-radius: 14px;
    background: #fff;
    animation: detailPanelEnter 0.3s ease both;
  }

  @keyframes detailPanelEnter {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .route-hint { color: var(--muted); font-size: 0.9rem; }

  .route-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 14px 0;
  }

  .route-stat {
    padding: 12px;
    border: 1px solid #cbd7e2;
    border-radius: 8px;
    text-align: center;
    background: #f7fbff;
  }

  .route-stat strong { display: block; font-size: 1.3rem; color: var(--blue-900); }

  .crowd-gauge {
    position: relative;
    width: 180px;
    height: 92px;
    margin: 12px auto 8px;
    overflow: hidden;
    border-radius: 180px 180px 0 0;
    background: conic-gradient(from 270deg at 50% 100%, #34b56b 0deg, #f5cf4f 55deg, #f08d3e 115deg, #de3f3f 180deg, transparent 180deg);
  }

  .crowd-gauge::after {
    content: '';
    position: absolute;
    left: 35px;
    right: 35px;
    bottom: 0;
    height: 58px;
    border-radius: 80px 80px 0 0;
    background: white;
  }

  .crowd-needle {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 0;
    width: 4px;
    height: 72px;
    background: #333;
    transform-origin: 50% 100%;
    transform: translateX(-50%) rotate(-65deg);
    transition: transform 0.55s ease;
  }

  .crowd-needle::after {
    content: '';
    position: absolute;
    left: -6px;
    bottom: -6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #333;
  }

  .crowd-label { text-align: center; font-weight: 800; }

  .facility-status {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 14px 0;
  }

  .facility-status div {
    padding: 8px 4px;
    border-radius: 8px;
    text-align: center;
    font-size: 0.82rem;
    background: #edf0f2;
    filter: grayscale(1);
    opacity: 0.55;
  }

  .facility-status div.is-available { background: #d9f4e2; filter: none; opacity: 1; }
  .facility-icon { display: block; font-size: 1.55rem; }

  .checkin-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid #d4dce4; }
  .checkin-controls { display: flex; gap: 8px; }
  .checkin-controls input { min-width: 0; flex: 1; padding: 8px; border: 1px solid #9aaabd; border-radius: 6px; }
  .checkin-button { padding: 8px 12px; border: 1px solid #6a9b7b; border-radius: 6px; background: #d9f4e2; cursor: pointer; }
  .checkin-button.is-complete { animation: checkinPulse 0.7s ease; }
  .checkin-list { margin: 10px 0 0; padding-left: 20px; max-height: 130px; overflow-y: auto; }

  @keyframes checkinPulse { 50% { transform: scale(1.08); background: #8ee0a8; } }

  #shelterMap {
    width: 100%;
    height: 620px;
    min-height: 420px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.93rem;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff3b30;
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(255,59,48,0.16);
  }

  .legend-dot.closed { background: #111; box-shadow: 0 0 0 3px rgba(17,17,17,0.14); }

  .damage-legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #8e44ad;
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(142,68,173,0.18);
  }

  .damage-marker {
    background: #8e44ad;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(142,68,173,0.28);
  }

  .shelter-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .shelter-actions button,
  .shelter-actions a {
    flex: 1;
    border: 0;
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }

  .shelter-detail-button {
    background: #e8f3ff;
    color: var(--blue-900);
  }

  .shelter-route-link {
    background: var(--blue-700);
    color: white;
  }

  .selected-shelter {
    display: none;
    margin-top: 14px;
    padding: 16px;
    border: 1px solid rgba(29, 130, 210, 0.18);
    border-radius: 12px;
    background: #f7fbff;
  }

  .selected-shelter.is-visible {
    display: block;
  }

  .selected-shelter h3 {
    margin: 0 0 8px;
    color: var(--blue-900);
  }

  .selected-shelter p {
    margin: 4px 0;
  }

  @media (max-width: 640px) {
    .search-header {
      align-items: flex-start;
      flex-direction: column;
    }

    #shelterMap {
      height: 480px;
    }

    .search-layout { grid-template-columns: 1fr; }
    .shelter-detail-panel { min-height: 0; }
  }
</style>

<div class="search-wrap">
  <div class="search-panel">
    <div class="search-header">
      <div class="search-title">
        <span class="section-icon" aria-hidden="true">🧭</span>
        <span>青森市避難所検索</span>
      </div>

      <label class="filter-box" for="districtSelect">
        <span>地域選択</span>
        <select id="districtSelect" aria-label="地域を選択">
          <option value="全域">全域</option>
          <option value="北部">北部</option>
          <option value="中央(1)">中央(1)</option>
          <option value="中央(2)">中央(2)</option>
          <option value="東部">東部</option>
          <option value="南部">南部</option>
          <option value="浪岡地区">浪岡地区</option>
        </select>
        <span>地区選択</span>
        <select id="areaSelect" aria-label="地区を選択" disabled>
          <option value="">地域を先に選択</option>
        </select>
        <button id="shelterVisibilityButton" class="shelter-visibility-button" type="button" aria-pressed="false">
          既存の避難所を非表示
        </button>
      </label>
    </div>

    <div class="search-layout">
      <div>
        <div class="map-shell"><div id="shelterMap"></div></div>
        <p class="route-hint">地図をクリックして出発地点を指定すると、選択した避難所までの徒歩ルートを表示します。</p>
      </div>
      <aside id="shelterDetailPanel" class="shelter-detail-panel" aria-live="polite">
        <h2>避難所の詳細</h2>
        <p>避難所の赤いマーカーを選択してください。</p>
        <p class="route-hint">出発地点を指定するには左の地図をクリックしてください。</p>
      </aside>
    </div>
    <div class="legend"><span class="legend-dot"></span>開設中 <span class="legend-dot closed"></span>未開設 <span class="damage-legend-dot"></span>被害投稿（紫）</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const map = L.map('shelterMap', {
    zoomControl: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    attributionControl: true
  }).setView([40.822, 140.74], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);
  const damageMarkersLayer = L.layerGroup().addTo(map);
  const boundaryLayer = L.layerGroup().addTo(map);
  const districtSelect = document.getElementById('districtSelect');
  const areaSelect = document.getElementById('areaSelect');
  const shelterVisibilityButton = document.getElementById('shelterVisibilityButton');
  const detailPanel = document.getElementById('shelterDetailPanel');
  const routeLayer = L.layerGroup().addTo(map);
  let startPoint = null;
  let selectedShelterData = null;
  let routeRequestId = 0;
  let routeLine = null;
  let sheltersVisible = true;

  shelterVisibilityButton.addEventListener('click', function () {
    sheltersVisible = !sheltersVisible;
    if (sheltersVisible) {
      markersLayer.addTo(map);
    } else {
      map.removeLayer(markersLayer);
    }
    shelterVisibilityButton.setAttribute('aria-pressed', String(!sheltersVisible));
    shelterVisibilityButton.textContent = sheltersVisible
      ? '既存の避難所を非表示'
      : '既存の避難所を表示';
  });

  map.on('click', function (event) {
    startPoint = event.latlng;
    routeLayer.clearLayers();
    routeLine = null;
    L.circleMarker(startPoint, {
      radius: 7,
      color: '#174a9c',
      fillColor: '#4d90fe',
      fillOpacity: 1
    }).bindPopup('出発地点').openPopup().addTo(routeLayer);
    if (selectedShelterData) {
      showShelterDetail(selectedShelterData);
    } else {
      detailPanel.innerHTML = '<h2>出発地点を設定しました</h2><p>避難所の赤いマーカーを選択すると徒歩ルートを表示します。</p>';
    }
  });

  const districtBoundaries = {
    '北部': [[40.857, 140.705], [40.865, 140.725], [40.865, 140.765], [40.845, 140.782], [40.835, 140.772], [40.832, 140.738], [40.842, 140.71], [40.857, 140.705]],
    '西部': [[40.83, 140.665], [40.838, 140.675], [40.842, 140.71], [40.832, 140.738], [40.815, 140.735], [40.806, 140.695], [40.818, 140.67], [40.83, 140.665]],
    '中央部': [[40.805, 140.72], [40.818, 140.718], [40.82, 140.765], [40.805, 140.765], [40.8, 140.738], [40.805, 140.72]],
    '東部': [[40.805, 140.72], [40.82, 140.718], [40.82, 140.766], [40.805, 140.77], [40.796, 140.75], [40.798, 140.728], [40.805, 140.72]],
    '南東部': [[40.788, 140.748], [40.81, 140.772], [40.81, 140.805], [40.79, 140.81], [40.775, 140.788], [40.778, 140.758], [40.788, 140.748]],
    '南部': [[40.78, 140.698], [40.792, 140.706], [40.8, 140.738], [40.794, 140.764], [40.774, 140.768], [40.764, 140.728], [40.77, 140.703], [40.78, 140.698]],
    '浪岡地区': [[40.86, 140.685], [40.878, 140.69], [40.882, 140.728], [40.87, 140.744], [40.852, 140.732], [40.854, 140.695], [40.86, 140.685]]
  };

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));
  }

  function popupHtml(shelter) {
    const isOpen = shelter.is_open !== false;
    return `
      <div style="min-width: 200px; max-width: 240px; line-height: 1.7;">
        <div style="font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; color: #0d3e72;">${escapeHtml(shelter.name)}</div>
        <div><strong>開設状況:</strong> ${isOpen ? '開設中' : '未開設'}</div>
        <div><strong>地区:</strong> ${escapeHtml(shelter.district || '未登録')}</div>
        <div><strong>地区名:</strong> ${escapeHtml(shelter.area || '未登録')}</div>
        <div><strong>住所:</strong> ${escapeHtml(shelter.address || '未登録')}</div>
        <div><strong>収容人数:</strong> ${escapeHtml(shelter.capacity ?? '未登録')}人</div>
        <div><strong>津波:</strong> ${escapeHtml(shelter.tsunami || '未登録')}</div>
        <div><strong>土砂災害:</strong> ${escapeHtml(shelter.landslide || '未登録')}</div>
        <div style="margin-top: 8px; color: #42566d;">${escapeHtml(shelter.description || '')}</div>
        <div class="shelter-actions">
          <button type="button" class="shelter-detail-button" data-shelter-id="${escapeHtml(shelter.id)}">詳細</button>
          <button type="button" class="shelter-route-link" data-route-shelter-id="${escapeHtml(shelter.id)}">サイト内でルート表示</button>
        </div>
      </div>
    `;
  }

  function damagePopupHtml(post) {
    return `<div style="min-width: 180px; line-height: 1.6;">
      <strong style="color: #6c3483;">災害・被害投稿</strong>
      <div><strong>住所:</strong> ${escapeHtml(post.address || '未登録')}</div>
      <div>${escapeHtml(post.comment || 'コメントなし')}</div>
    </div>`;
  }

  function renderDamageMarkers(posts) {
    damageMarkersLayer.clearLayers();
    posts.forEach(function (post) {
      if (!Number.isFinite(post.latitude) || !Number.isFinite(post.longitude)) return;
      L.circleMarker([post.latitude, post.longitude], {
        radius: 7,
        color: '#6c3483',
        weight: 2,
        fillColor: '#8e44ad',
        fillOpacity: 0.92
      }).bindPopup(damagePopupHtml(post)).addTo(damageMarkersLayer);
    });
  }

  function showShelterDetail(shelter) {
    selectedShelterData = shelter;
    const crowdIndex = {
      '空いている': 0,
      'やや空いている': 25,
      'やや混雑': 50,
      '混雑': 75,
      '満員': 100
    }[shelter.crowd_status || '空いている'] || 0;
    const crowdAngle = -65 + (130 * crowdIndex / 100);
    detailPanel.innerHTML = `
      <h3>${escapeHtml(shelter.name)}</h3>
      <p><strong>地区:</strong> ${escapeHtml(shelter.district || '未登録')}</p>
      <p><strong>地区名:</strong> ${escapeHtml(shelter.area || '未登録')}</p>
      <div class="route-summary" id="routeSummary">
        <div class="route-stat"><strong id="walkTime">--</strong>徒歩</div>
        <div class="route-stat"><strong id="walkDistance">--</strong>距離</div>
      </div>
      <div class="crowd-gauge" aria-label="混雑度 ${escapeHtml(shelter.crowd_status || '空いている')}"><span class="crowd-needle" style="transform: translateX(-50%) rotate(${crowdAngle}deg);"></span></div>
      <div class="crowd-label">混雑度: ${escapeHtml(shelter.crowd_status || '空いている')}</div>
      <div class="facility-status">
        <div class="${shelter.multipurpose_toilet ? 'is-available' : ''}"><span class="facility-icon">🚻</span>多目的トイレ<br>${shelter.multipurpose_toilet ? 'あり' : 'なし'}</div>
        <div class="${shelter.pets_allowed ? 'is-available' : ''}"><span class="facility-icon">🐕</span>ペット<br>${shelter.pets_allowed ? '可' : '不可'}</div>
        <div class="${shelter.wheelchair_accessible ? 'is-available' : ''}"><span class="facility-icon">♿</span>車いす<br>${shelter.wheelchair_accessible ? '対応' : '未対応'}</div>
      </div>
      <p><strong>収容人数:</strong> ${escapeHtml(shelter.capacity ?? '未登録')}人</p>
      <p><strong>津波:</strong> ${escapeHtml(shelter.tsunami || '未登録')}</p>
      <p><strong>土砂災害:</strong> ${escapeHtml(shelter.landslide || '未登録')}</p>
      <p>${escapeHtml(shelter.description || '')}</p>
      <div class="checkin-box">
        <strong>チェックイン</strong>
        <div class="checkin-controls">
          <input id="checkinName" type="text" maxlength="40" placeholder="名前（任意）">
          <button id="checkinButton" class="checkin-button" type="button">チェックイン</button>
        </div>
        <ul id="checkinList" class="checkin-list"><li>チェックインした人はいません</li></ul>
      </div>
    `;
    document.getElementById('checkinButton').addEventListener('click', function () {
      const name = document.getElementById('checkinName').value.trim() || '匿名の利用者';
      const list = document.getElementById('checkinList');
      const empty = list.querySelector('li');
      if (empty && empty.textContent === 'チェックインした人はいません') list.innerHTML = '';
      const entry = document.createElement('li');
      entry.textContent = `${name}（いまチェックイン）`;
      list.prepend(entry);
      this.classList.remove('is-complete');
      void this.offsetWidth;
      this.classList.add('is-complete');
    });
    updateWalkingRoute(shelter);
  }

  function updateWalkingRoute(shelter) {
    const currentRequestId = ++routeRequestId;
    if (!startPoint) return;
    const walkTime = document.getElementById('walkTime');
    const walkDistance = document.getElementById('walkDistance');
    walkTime.textContent = '取得中';
    walkDistance.textContent = '取得中';
    const directStart = [startPoint.lng, startPoint.lat];
    const directEnd = [shelter.lng, shelter.lat];
    const hazards = window.damagePosts || [];
    const deltaLng = directEnd[0] - directStart[0];
    const deltaLat = directEnd[1] - directStart[1];
    const length = Math.hypot(deltaLng, deltaLat) || 1;
    const nearbyHazards = hazards.filter(function (post) {
      if (!Number.isFinite(post.latitude) || !Number.isFinite(post.longitude)) return false;
      const along = ((post.longitude - directStart[0]) * deltaLng + (post.latitude - directStart[1]) * deltaLat) / (length * length);
      const cross = Math.abs((post.longitude - directStart[0]) * deltaLat - (post.latitude - directStart[1]) * deltaLng) / length;
      return along > 0.08 && along < 0.92 && cross < 0.012;
    }).sort(function (left, right) {
      const leftAlong = (left.longitude - directStart[0]) * deltaLng + (left.latitude - directStart[1]) * deltaLat;
      const rightAlong = (right.longitude - directStart[0]) * deltaLng + (right.latitude - directStart[1]) * deltaLat;
      return leftAlong - rightAlong;
    }).slice(0, 4);
    const candidates = [{ points: [directStart, directEnd], avoidsHazards: false }];
    if (nearbyHazards.length > 1) {
      candidates.push({
        points: [directStart].concat(nearbyHazards.map(function (post, index) {
          const offset = 0.018 + index * 0.003;
          return [
            post.longitude - offset * (-deltaLat / length),
            post.latitude - offset * (deltaLng / length)
          ];
        }), [directEnd]),
        avoidsHazards: true
      });
    }
    nearbyHazards.forEach(function (post, index) {
      const offset = 0.018 + index * 0.003;
      const side = index % 2 === 0 ? 1 : -1;
      candidates.push({
        points: [
          directStart,
          [
            post.longitude + side * offset * (-deltaLat / length),
            post.latitude + side * offset * (deltaLng / length)
          ],
          directEnd
        ],
        avoidsHazards: true
      });
    });

    function routeUrl(points) {
      const coordinates = points.map(point => point.join(',')).join(';');
      return `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson&steps=false`;
    }

    Promise.all(candidates.map(function (candidate) {
      return fetch(routeUrl(candidate.points))
        .then(response => response.ok ? response.json() : null)
        .then(data => data && data.routes?.length ? { route: data.routes[0], avoidsHazards: candidate.avoidsHazards } : null)
        .catch(() => null);
    }))
      .then(results => {
        const available = results.filter(Boolean);
        if (currentRequestId !== routeRequestId || !available.length) throw new Error('route unavailable');
        const routeResult = available.sort((left, right) => {
          const leftScore = left.route.distance + (!left.avoidsHazards && nearbyHazards.length ? 100000 : 0);
          const rightScore = right.route.distance + (!right.avoidsHazards && nearbyHazards.length ? 100000 : 0);
          return leftScore - rightScore;
        })[0];
        const route = routeResult.route;
        if (routeLine) routeLayer.removeLayer(routeLine);
        routeLine = L.geoJSON(route.geometry, { style: { color: '#e53935', weight: 6, opacity: 0.9 } }).addTo(routeLayer);
        walkDistance.textContent = route.distance >= 1000 ? `${(route.distance / 1000).toFixed(1)}km` : `${Math.round(route.distance)}m`;
        walkTime.textContent = `${Math.max(1, Math.ceil(route.distance / 80))}分${routeResult.avoidsHazards ? '（被害地点を回避）' : ''}`;
      })
      .catch(() => {
        if (currentRequestId !== routeRequestId) return;
        walkTime.textContent = '--';
        walkDistance.textContent = '--';
        detailPanel.insertAdjacentHTML('beforeend', '<p class="route-hint">徒歩ルートを取得できませんでした。地図上の出発地点と避難所の位置を確認してください。</p>');
      });
  }

  function getFilteredShelters(selectedDistrict, selectedArea) {
    return allShelters.filter(function (shelter) {
      const matchesDistrict = selectedDistrict === '全域'
        || shelter.district === selectedDistrict;
      const matchesArea = !selectedArea || shelter.area === selectedArea;
      return matchesDistrict && matchesArea;
    });
  }

  function updateAreaOptions(selectedDistrict) {
    const areas = [...new Set(
      allShelters
        .filter(shelter => selectedDistrict === '全域' || shelter.district === selectedDistrict)
        .map(shelter => shelter.area)
        .filter(Boolean)
    )].sort((left, right) => left.localeCompare(right, 'ja'));

    areaSelect.innerHTML = '<option value="">すべての地区</option>';
    areas.forEach(function (area) {
      const option = document.createElement('option');
      option.value = area;
      option.textContent = area;
      areaSelect.appendChild(option);
    });
    areaSelect.disabled = areas.length === 0;
  }

  function renderMarkers(selectedDistrict, selectedArea) {
    markersLayer.clearLayers();
    boundaryLayer.clearLayers();

    const selectedShelters = getFilteredShelters(selectedDistrict, selectedArea);

    allShelters.forEach(function (shelter) {
      if (!shelter.lat || !shelter.lng) return;

      const marker = L.circleMarker([shelter.lat, shelter.lng], {
        radius: 8,
        color: '#d11a2a',
        weight: 2,
        fillColor: shelter.is_open !== false ? '#ff3b30' : '#111',
        fillOpacity: 0.9
      });

      marker.bindPopup(popupHtml(shelter));
      marker.on('popupopen', function (event) {
        const detailButton = event.popup.getElement().querySelector('.shelter-detail-button');
        detailButton.addEventListener('click', function () {
          showShelterDetail(shelter);
        });
        const routeButton = event.popup.getElement().querySelector('.shelter-route-link');
        routeButton.addEventListener('click', function () {
          showShelterDetail(shelter);
          event.popup.remove();
        });
      });
      marker.addTo(markersLayer);
    });

    if (selectedDistrict !== '全域' && !selectedArea && districtBoundaries[selectedDistrict]) {
      const polygon = L.polygon(districtBoundaries[selectedDistrict], {
        color: '#ff3b30',
        weight: 3,
        opacity: 1,
        fillOpacity: 0.08,
        dashArray: '8 6'
      });
      polygon.addTo(boundaryLayer);
      map.fitBounds(polygon.getBounds().pad(0.18));
      return;
    }

    const sheltersWithCoordinates = selectedShelters.filter(shelter => shelter.lat && shelter.lng);
    if (sheltersWithCoordinates.length > 0) {
      const bounds = L.latLngBounds(sheltersWithCoordinates.map(s => [s.lat, s.lng]));
      map.fitBounds(bounds.pad(0.22));
    } else {
      map.setView([40.822, 140.74], 12);
    }
  }

  fetch('/shelters')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('避難所データの取得に失敗しました');
      }
      return response.json();
    })
    .then(function (data) {
      window.allShelters = data;
      updateAreaOptions('全域');
      renderMarkers('全域', '');
    })
    .catch(function (error) {
      console.error(error);
      const message = '避難所データを取得できませんでした。';
      map.setView([40.822, 140.74], 12);
      L.popup()
        .setLatLng([40.822, 140.74])
        .setContent(message)
        .openOn(map);
    });

  fetch('/api/damage_posts')
    .then(function (response) {
      if (!response.ok) throw new Error('被害投稿の取得に失敗しました');
      return response.json();
    })
    .then(function (posts) {
      window.damagePosts = posts;
      renderDamageMarkers(posts);
    })
    .catch(function (error) {
      console.error(error);
      window.damagePosts = [];
    });

  districtSelect.addEventListener('change', function () {
    updateAreaOptions(this.value);
    areaSelect.value = '';
    renderMarkers(this.value, '');
  });

  areaSelect.addEventListener('change', function () {
    renderMarkers(districtSelect.value, this.value);
  });
});
</script>
{% endblock %}
