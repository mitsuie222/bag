{% extends "base.html" %}

{% block content %}
<div class="card map-card">
  <div class="section-head">
    <span class="section-icon" aria-hidden="true">📍</span>
    <span>避難所マップ</span>
  </div>
  <div class="map-box">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="card weather-card">
  <div class="weather-header">
    <div class="weather-title">
      <span class="section-icon" aria-hidden="true">🌤️</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <div class="auto-update">↻ 10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-content">
    <div class="weather-item"><span class="status-dot"></span>読み込み中...</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', {
        zoomControl: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        dragging: true,
        attributionControl: true
    }).setView([40.8244, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function popupHtml(shelter) {
      return `
        <div style="min-width: 220px; max-width: 280px; line-height: 1.7;">
          <div style="font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; color: #0d3e72;">${escapeHtml(shelter.name)}</div>
          <div><strong>住所:</strong> ${escapeHtml(shelter.address || '未登録')}</div>
          <div><strong>収容人数:</strong> ${escapeHtml(shelter.capacity ?? '未登録')}人</div>
          <div><strong>津波:</strong> ${escapeHtml(shelter.tsunami || '未登録')}</div>
          <div><strong>土砂災害:</strong> ${escapeHtml(shelter.landslide || '未登録')}</div>
        </div>
      `;
    }

    fetch('/shelters')
      .then(response => response.json())
      .then(shelters => {
        const bounds = [];
        shelters.forEach(shelter => {
          if (shelter.lat == null || shelter.lng == null) return;
          const marker = L.circleMarker([shelter.lat, shelter.lng], {
            radius: 8,
            color: '#d11a2a',
            weight: 2,
            fillColor: '#ff3b30',
            fillOpacity: 0.9
          }).bindPopup(popupHtml(shelter));
          marker.addTo(markersLayer);
          bounds.push([shelter.lat, shelter.lng]);
        });
        if (bounds.length) map.fitBounds(bounds, {padding: [24, 24]});
      })
      .catch(error => console.error('避難所データの取得に失敗しました:', error));

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<div class="weather-item"><span class="status-dot" style="background:#f59e0b; box-shadow:0 0 0 4px rgba(245,158,11,0.15);"></span>気象情報の取得に失敗しました</div>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = data.warnings.map(warning => `
                <div class="weather-item">
                    <span class="status-dot"></span>
                    <span>${warning.name}（${warning.status}）</span>
                </div>
            `).join('');
        } else {
            warningsHtml = '<div class="weather-item"><span class="status-dot"></span><span>現在、警報・注意報は発表されていません</span></div>';
        }

        weatherContent.innerHTML = `
            <div class="weather-item"><span class="status-dot"></span><span>対象地域: ${data.area_name || '青森市'}</span></div>
            ${warningsHtml}
            <div class="weather-meta">
              <div>最終確認: <span>${data.last_fetch_time || '更新中...'}</span></div>
              <div>気象庁最終発表: ${data.report_time || '不明'}</div>
            </div>
        `;
    }

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
                const weatherContent = document.getElementById('weatherContent');
                weatherContent.innerHTML = '<div class="weather-item"><span class="status-dot" style="background:#ef4444; box-shadow:0 0 0 4px rgba(239,68,68,0.15);"></span>気象情報の更新に失敗しました</div>';
            });
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
